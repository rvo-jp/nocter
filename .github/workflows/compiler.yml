name: Compiler

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.96.1

jobs:
  fast:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the source revision
        uses: actions/checkout@v6

      - name: Install the compiler toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Run the change-feedback gate
        run: cargo --version && development/verification/verify-compiler.sh --fast

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out the source revision
        uses: actions/checkout@v6

      - name: Install the compiler toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Run the complete compiler gate
        run: cargo --version && development/verification/verify-compiler.sh --full
