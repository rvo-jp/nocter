<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Nocter OG Image</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f7f8fc;
            --text: #293954;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--background);
        }

        .og-mark {
            display: flex;
            align-items: center;
            gap: 56px;
        }

        .og-logo {
            width: 172px;
            height: 172px;
        }

        .og-title {
            margin: 0;
            font-size: 124px;
            font-weight: 760;
            line-height: 1;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <main class="og-mark" aria-label="Nocter">
        <img class="og-logo" src="./logo.svg" alt="Nocter Logo" width="172" height="172">
        <h1 class="og-title">Nocter</h1>
    </main>
</body>
</html>
