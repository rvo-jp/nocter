[package]
name = "nocter-package-acquisition"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
gix = { version = "0.86.0", default-features = false, features = ["blocking-http-transport-reqwest", "sha1"] }
nocter-hash = { path = "../nocter-hash" }
nocter-package = { path = "../nocter-package" }
nocter-package-state = { path = "../nocter-package-state" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tar = { version = "0.4.46", default-features = false }

[lints]
workspace = true
