nocter-target-selection = { path = "../nocter-target-selection" }
nocter-toolchain-contract = { path = "../nocter-toolchain-contract" }

[dev-dependencies]
nocter-checking = { path = "../nocter-checking", features = ["test-api"] }
nocter-declaration-lowering = { path = "../nocter-declaration-lowering", features = ["test-api"] }
