[workspace]
members = [
    "crates/nocter-analysis",
    "crates/nocter-cli",
    "crates/nocter-arm64",
    "crates/nocter-checking",
    "crates/nocter-compile-input",
    "crates/nocter-command",
    "crates/nocter-constant-evaluation",
    "crates/nocter-conformance",
    "crates/nocter-declarations",
    "crates/nocter-declaration-lowering",
    "crates/nocter-discovery",
    "crates/nocter-diagnostics",
    "crates/nocter-filesystem",
    "crates/nocter-frontend-bindings",
    "crates/nocter-hash",
    "crates/nocter-installation",
    "crates/nocter-json",
    "crates/nocter-language",
    "crates/nocter-language-server",
    "crates/nocter-lsp",
    "crates/nocter-machine",
    "crates/nocter-macho",
    "crates/nocter-model",
    "crates/nocter-mir",
    "crates/nocter-native-session",
    "crates/nocter-package",
    "crates/nocter-package-acquisition",
    "crates/nocter-package-state",
    "crates/nocter-persistent",
    "crates/nocter-runtime-contract",
    "crates/nocter-session",
    "crates/nocter-source",
    "crates/nocter-source-index",
    "crates/nocter-source-tooling",
    "crates/nocter-syntax",
    "crates/nocter-target-program",
    "crates/nocter-target-selection",
    "crates/nocter-test-support",
    "crates/nocter-toolchain-contract",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
