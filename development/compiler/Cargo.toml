[workspace]
members = [
    "crates/nocter-declarations",
    "crates/nocter-declaration-lowering",
    "crates/nocter-model",
    "crates/nocter-source",
    "crates/nocter-source-index",
    "crates/nocter-syntax",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
