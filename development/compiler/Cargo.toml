[workspace]
members = [
    "crates/nocter-analysis",
    "crates/nocter-cli",
    "crates/nocter-arm64",
    "crates/nocter-checking",
    "crates/nocter-compile-input",
    "crates/nocter-command",
    "crates/nocter-compiler-computation",
    "crates/nocter-computation",
    "crates/nocter-content-integrity",
    "crates/nocter-constant-evaluation",
    "crates/nocter-conformance",
    "crates/nocter-declarations",
    "crates/nocter-declaration-lowering",
    "crates/nocter-discovery",
    "crates/nocter-diagnostics",
    "crates/nocter-filesystem",
    "crates/nocter-frontend-bindings",
    "crates/nocter-hash",
    "crates/nocter-installation",
    "crates/nocter-json",
    "crates/nocter-language",
    "crates/nocter-language-server",
    "crates/nocter-lsp",
    "crates/nocter-machine",
    "crates/nocter-macho",
    "crates/nocter-model",
    "crates/nocter-mir",
    "crates/nocter-native-session",
    "crates/nocter-package",
    "crates/nocter-package-acquisition",
    "crates/nocter-package-cache",
    "crates/nocter-package-state",
    "crates/nocter-persistent",
    "crates/nocter-runtime-contract",
    "crates/nocter-semantic-product",
    "crates/nocter-session",
    "crates/nocter-source",
    "crates/nocter-source-index",
    "crates/nocter-source-tooling",
    "crates/nocter-standard-profile",
    "crates/nocter-syntax",
    "crates/nocter-target-program",
    "crates/nocter-target-selection",
    "crates/nocter-test-support",
    "crates/nocter-toolchain-contract",
    "crates/nocter-workspace-analysis",
    "crates/nocter-workspace-revision",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

# The workspace has many small responsibility crates. Full debuginfo and per-crate incremental
# object graphs consume substantially more disk than the compiler itself, while release
# qualification already uses a separate clean target directory. Keep ordinary development caches
# compact and reproducible. The development compiler retains line tables for debugger use; bulk
# test executables omit debug payload because complete gates run in disposable external targets.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = 0
incremental = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
