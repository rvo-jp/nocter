[package]
name = "nocter"
version = "0.13.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Nocter has a large compiler test crate. Cargo's macOS defaults retain unpacked
# debug objects and incremental state for it, which can grow target/ by tens of
# gigabytes. Keep source line tables for useful backtraces without retaining
# those workspace-local caches.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = false

[profile.test]
# Integration tests execute the compiler binary hundreds of times. Level 1
# removes the dominant unoptimized-compiler cost while retaining test-profile
# debug assertions and keeping compile time close to the development profile.
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "off"
incremental = false
